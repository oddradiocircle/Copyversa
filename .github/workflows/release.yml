name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Package
        run: |
          (cd dist/extension && zip -qr ../copyversa-extension.zip .)
          cd dist && sha256sum copyversa.user.js copyversa.meta.js copyversa-extension.zip > SHA256SUMS.txt

      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/copyversa.user.js
            dist/copyversa-extension.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/copyversa.user.js dist/copyversa.meta.js dist/copyversa-extension.zip dist/SHA256SUMS.txt \
            --title "CopyVersa $VERSION" --notes-file notes.md --verify-tag

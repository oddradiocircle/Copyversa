name: Proponer una mejora
description: Una idea para que CopyVersa sea más útil.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qué intentas hacer
      description: Describe la tarea y qué te lo impide hoy.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Qué propones
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Ejemplos o contexto
      description: Páginas públicas, capturas o el resultado que esperas.

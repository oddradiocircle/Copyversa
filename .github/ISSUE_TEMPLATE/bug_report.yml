name: Reportar un error
description: Algo no se copia bien o CopyVersa no funciona.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No pegues datos confidenciales** (expedientes, datos personales, sistemas internos). Si la página es privada, describe su estructura o usa un ejemplo ficticio.
  - type: input
    id: version
    attributes:
      label: Versión de CopyVersa
      placeholder: '4.0.0'
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Instalación
      options:
        - Userscript con Tampermonkey
        - Userscript con Violentmonkey
        - Extensión de Chrome o Edge
        - Otra
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y versión
      placeholder: Chrome 156, Firefox 140…
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Formato
      options: [Markdown, Texto, Enriquecido, HTML]
  - type: input
    id: page
    attributes:
      label: Página pública donde ocurre (si la hay)
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir…
        2. Pulsar Ctrl+Shift+X y hacer clic en…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas y qué obtuviste
      description: Si puedes, pega el resultado copiado.
    validations:
      required: true
